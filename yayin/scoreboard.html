<script>
"use strict";

const SUPABASE_JS = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
const YENILEME_ARALIGI = 4000;  // ms; leaderboard RPC'si bu sıklıkla çağrılır
const RPC_ZAMAN_ASIMI = 8000;   // ms

const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------------
// Supabase: index.html ile aynı yöntem (sadece .rpc(), tabloya erişim yok)
// ---------------------------------------------------------------------
let sbIstemci = null;
let sbYukleniyor = null;

function istemciAl() {
  if (sbIstemci) return Promise.resolve(sbIstemci);
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return Promise.reject(new Error("ayar_eksik"));
  if (!sbYukleniyor) {
    sbYukleniyor = new Promise((tamam, hata) => {
      const s = document.createElement("script");
      s.src = SUPABASE_JS;
      s.async = true;
      s.onload = () => {
        try {
          sbIstemci = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
          });
          tamam(sbIstemci);
        } catch (e) { hata(e); }
      };
      s.onerror = () => { s.remove(); hata(new Error("kutuphane_yuklenemedi")); };
      document.head.appendChild(s);
    }).catch((e) => { sbYukleniyor = null; throw e; });
  }
  return sbYukleniyor;
}

function zamanAsimi(ms) {
  return new Promise((_, hata) => setTimeout(() => hata(new Error("zaman_asimi")), ms));
}

// Standda sorun ayıklamak için hata konsola yazılır: sadece fonksiyon adı,
// hata kodu ve mesajı. Parametreler (Instagram kullanıcı adı) ve satır verisi
// içerebilen "details" alanı asla yazılmaz.
function hataYazdir(ad, e) {
  const kod = (e && (e.code || e.name)) || "-";
  const mesaj = String((e && e.message) || e);
  console.error(`[Supabase] ${ad} başarısız · kod: ${kod} · mesaj: ${mesaj}`);
}

async function rpc(ad, parametreler) {
  const istek = istemciAl().then((sb) => sb.rpc(ad, parametreler)).then(({ data, error }) => {
    if (error) throw error;
    return data;
  });
  try {
    return await Promise.race([istek, zamanAsimi(RPC_ZAMAN_ASIMI)]);
  } catch (e) {
    hataYazdir(ad, e);
    throw e;
  }
}

// ---------------------------------------------------------------------
// Ses (WebAudio; "Sesi aç" butonuyla başlar)
// ---------------------------------------------------------------------
let ses = null;
let sesAcik = false;

function ton(frekans, sure, tip, guc, gecikme) {
  if (!ses || !sesAcik) return;
  const t = ses.currentTime + (gecikme || 0);
  const o = ses.createOscillator();
  const g = ses.createGain();
  o.type = tip;
  o.frequency.setValueAtTime(frekans, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(guc, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
  o.connect(g).connect(ses.destination);
  o.start(t);
  o.stop(t + sure + 0.02);
}
const sesler = {
  degisim: () => { ton(660, 0.18, "triangle", 0.25); ton(990, 0.25, "triangle", 0.25, 0.12); },
  yeniLider: () => { ton(523, 0.2, "square", 0.12); ton(659, 0.2, "square", 0.12, 0.15); ton(784, 0.2, "square", 0.12, 0.3); ton(1047, 0.45, "square", 0.12, 0.45); },
};

$("sesBtn").addEventListener("click", () => {
  if (!ses) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) ses = new AC();
  }
  if (ses && ses.state === "suspended") ses.resume();
  sesAcik = !sesAcik;
  $("sesBtn").textContent = sesAcik ? "🔇 Sesi kapat" : "🔊 Sesi aç";
  if (sesAcik) sesler.degisim();
});

$("tamEkranBtn").addEventListener("click", () => {
  const el = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
});

// Fare bir süre hareket etmezse imleci ve butonları gizle
let imlecZamanlayici = 0;
function imlecHareket() {
  document.body.classList.remove("bos-imlec");
  clearTimeout(imlecZamanlayici);
  imlecZamanlayici = setTimeout(() => document.body.classList.add("bos-imlec"), 3000);
}
window.addEventListener("mousemove", imlecHareket);
imlecHareket();

// ---------------------------------------------------------------------
// İlk 10 listesi: sıra değişince satır kayar, parlar ve ses çalar
// ---------------------------------------------------------------------
let oncekiListe = null;          // null: henüz hiç veri gelmedi (ilk yüklemede parlama yok)
const satirlar = new Map();      // anahtar → <li>

// leaderboard "@kullaniciadi" ve skor döndürür. Kullanıcı adı benzersizdir;
// yine de aynı ad iki kez gelirse karışmasın diye anahtar "ad#kaçıncı tekrar".
function anahtarla(liste) {
  const sayac = new Map();
  return liste.map((satir) => {
    const n = (sayac.get(satir.name) || 0) + 1;
    sayac.set(satir.name, n);
    return { anahtar: `${satir.name}#${n}`, name: satir.name, best: satir.best };
  });
}

function satirOlustur() {
  const li = document.createElement("li");
  for (const sinif of ["sira", "ad", "puan"]) {
    const span = document.createElement("span");
    span.className = sinif;
    li.appendChild(span);
  }
  return li;
}

function listeGuncelle(hamListe) {
  const yeni = anahtarla(hamListe);
  const ol = $("liste");

  // Değişen satırları bul: yeni giren, yükselen veya skoru artan
  const eskiSira = new Map();
  const eskiSkor = new Map();
  if (oncekiListe) oncekiListe.forEach((s, i) => { eskiSira.set(s.anahtar, i); eskiSkor.set(s.anahtar, s.best); });
  const parlayanlar = new Set();
  if (oncekiListe) {
    yeni.forEach((s, i) => {
      const eski = eskiSira.get(s.anahtar);
      if (eski === undefined || i < eski || s.best !== eskiSkor.get(s.anahtar)) parlayanlar.add(s.anahtar);
    });
  }
  const yeniLider = oncekiListe && yeni.length > 0 &&
    (oncekiListe.length === 0 || oncekiListe[0].anahtar !== yeni[0].anahtar);

  // FLIP: eski konumları ölç
  const ilkKonum = new Map();
  for (const [k, li] of satirlar) ilkKonum.set(k, li.getBoundingClientRect().top);

  // DOM'u yeni sıraya göre kur (metinler textContent ile)
  const kalanlar = new Set();
  yeni.forEach((s, i) => {
    let li = satirlar.get(s.anahtar);
    if (!li) { li = satirOlustur(); satirlar.set(s.anahtar, li); }
    li.children[0].textContent = `${i + 1}.`;
    li.children[1].textContent = s.name;
    li.children[2].textContent = String(s.best);
    ol.appendChild(li);
    kalanlar.add(s.anahtar);
  });
  for (const [k, li] of satirlar) {
    if (!kalanlar.has(k)) { li.remove(); satirlar.delete(k); }
  }

  // FLIP: yer değiştiren satırları eski konumdan yeni konuma kaydır
  for (const [k, li] of satirlar) {
    const once = ilkKonum.get(k);
    if (once === undefined) continue;
    const fark = once - li.getBoundingClientRect().top;
    if (Math.abs(fark) < 1) continue;
    li.style.transition = "none";
    li.style.transform = `translateY(${fark}px)`;
    li.getBoundingClientRect();   // stili uygula
    li.style.transition = "";
    li.style.transform = "";
  }

  for (const k of parlayanlar) {
    const li = satirlar.get(k);
    li.classList.remove("parla");
    void li.offsetWidth;          // animasyonu yeniden başlat
    li.classList.add("parla");
  }

  if (yeniLider) { sesler.yeniLider(); kutlamaGoster(yeni[0]); }
  else if (parlayanlar.size) sesler.degisim();

  $("bosListe").classList.toggle("gizli", yeni.length > 0);
  ol.classList.toggle("gizli", yeni.length === 0);
  oncekiListe = yeni;
}

// ---------------------------------------------------------------------
// Yeni lider kutlaması: 3 sn tam ekran, konfeti. Sadece gerçek bir lider
// değişiminde çağrılır (ilk yüklemede oncekiListe null olduğundan çağrılmaz).
// ---------------------------------------------------------------------
const KUTLAMA_SURE = 3000;
const KONFETI_SAYISI = 140;
let kutlamaZamanlayici = 0;
let konfetiKare = 0;

function kutlamaGoster(lider) {
  const el = $("kutlama");
  $("kutlamaAd").textContent = lider.name;
  $("kutlamaSkor").textContent = `${lider.best} puan`;
  el.classList.remove("gizli", "cikis");
  clearTimeout(kutlamaZamanlayici);
  konfetiBaslat();
  kutlamaZamanlayici = setTimeout(() => {
    el.classList.add("cikis");
    kutlamaZamanlayici = setTimeout(() => { el.classList.add("gizli"); konfetiDurdur(); }, 400);
  }, KUTLAMA_SURE - 400);
}

function konfetiBaslat() {
  const c = $("konfeti");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = c.clientWidth, H = c.clientHeight;
  c.width = Math.round(W * dpr);
  c.height = Math.round(H * dpr);
  const x = c.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const renkler = ["#ffd166", "#56b0ff", "#1a73e8", "#ffffff", "#ff7aa8", "#4ade80"];
  const parcalar = [];
  for (let i = 0; i < KONFETI_SAYISI; i++) {
    parcalar.push({
      x: Math.random() * W, y: -Math.random() * H * 0.5 - 20,
      vx: (Math.random() - 0.5) * 120, vy: 180 + Math.random() * 260,
      w: 8 + Math.random() * 8, h: 5 + Math.random() * 5,
      aci: Math.random() * Math.PI * 2, donus: (Math.random() - 0.5) * 10,
      renk: renkler[i % renkler.length],
    });
  }
  let onceki = performance.now();
  const bitis = onceki + KUTLAMA_SURE;
  const kare = (t) => {
    const dt = Math.min((t - onceki) / 1000, 0.05);
    onceki = t;
    x.clearRect(0, 0, W, H);
    for (const p of parcalar) {
      p.vy += 160 * dt;
      p.x += (p.vx + Math.sin(t / 300 + p.aci) * 40) * dt;
      p.y += p.vy * dt;
      p.aci += p.donus * dt;
      if (p.y > H + 20) { p.y = -20; p.vy = 180 + Math.random() * 200; }
      x.save();
      x.translate(p.x, p.y);
      x.rotate(p.aci);
      x.fillStyle = p.renk;
      x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.aci * 1.3)) + 1);
      x.restore();
    }
    if (t < bitis) konfetiKare = requestAnimationFrame(kare);
  };
  cancelAnimationFrame(konfetiKare);
  konfetiKare = requestAnimationFrame(kare);
}

function konfetiDurdur() {
  cancelAnimationFrame(konfetiKare);
  const c = $("konfeti");
  c.getContext("2d").clearRect(0, 0, c.width, c.height);
}

// ---------------------------------------------------------------------
// Yenileme döngüsü: 4 sn'de bir; hata olursa son liste ekranda kalır
// ---------------------------------------------------------------------
async function yenile() {
  const baslangic = Date.now();
  try {
    const liste = await rpc("leaderboard", { p_limit: 10 });
    listeGuncelle(Array.isArray(liste) ? liste : []);
    $("baglanti").classList.add("gizli");
  } catch (e) {
    $("baglanti").classList.remove("gizli");
  }
  setTimeout(yenile, Math.max(0, YENILEME_ARALIGI - (Date.now() - baslangic)));
}

// ---------------------------------------------------------------------
// QR kod (OYUN_URL)
// ---------------------------------------------------------------------
function qrCiz() {
  const tuval = $("qr");
  const yedek = $("qrYedek");
  $("oyunAdres").textContent = OYUN_URL.replace(/^https?:\/\//, "").replace(/\/$/, "");

  if (!OYUN_URL || typeof window.qrcode !== "function") {
    tuval.classList.add("gizli");
    yedek.classList.remove("gizli");
    yedek.textContent = OYUN_URL ? "QR kod yüklenemedi" : "OYUN_URL ayarlanmadı";
    return;
  }
  if (qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs["UTF-8"]) qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
  const qr = qrcode(0, "M");
  qr.addData(OYUN_URL);
  qr.make();

  const n = qr.getModuleCount();
  const bosluk = 4;                        // standart sessiz bölge
  tuval.classList.remove("gizli");
  yedek.classList.add("gizli");
  tuval.style.width = tuval.style.height = "0px";   // kutuyu ölçmeden önce eski boyutu sıfırla
  const kutu = $("qrKutu").getBoundingClientRect();
  const boyut = Math.max(100, Math.floor(Math.min(kutu.width, kutu.height)));
  const dpr = window.devicePixelRatio || 1;
  const modul = Math.max(1, Math.floor((boyut * dpr) / (n + bosluk * 2)));
  const piksel = modul * (n + bosluk * 2);

  tuval.width = piksel;
  tuval.height = piksel;
  tuval.style.width = piksel / dpr + "px";
  tuval.style.height = piksel / dpr + "px";
  const c = tuval.getContext("2d");
  c.fillStyle = "#ffffff";
  c.fillRect(0, 0, piksel, piksel);
  c.fillStyle = "#0b1020";
  for (let r = 0; r < n; r++) {
    for (let k = 0; k < n; k++) {
      if (qr.isDark(r, k)) c.fillRect((k + bosluk) * modul, (r + bosluk) * modul, modul, modul);
    }
  }
}

// ---------------------------------------------------------------------
// Dönen ACM reklam bandı (sadece doğrulanmış/ayarlanmış bilgiler)
// ---------------------------------------------------------------------
function bantKur() {
  const mesajlar = [
    "MSKÜ ACM Student Chapter",
    "23 Ekim'de Teknopark İzmir'in davetiyle teknik gezideyiz",
    "Debug Ördeği'ni oyna, skor tablosuna gir!",
  ];
  const linktree = String(LINKTREE_URL || "").trim().replace(/^https?:\/\//i, "").replace(/\/$/, "");
  if (linktree) mesajlar.push(`MSKÜ ACM'ye katıl: ${linktree}`);
  const insta = String(INSTAGRAM_HESABI || "").trim().replace(/^@/, "");
  if (insta) mesajlar.push(`Ödül için Instagram'da @${insta}'yi takip et!`);   // Türkçe ek sabit
  if (ODUL_METNI) mesajlar.push(`Ödül: ${ODUL_METNI}`);

  // Kesintisiz döngü için içerik iki kez eklenir; animasyon %50 kayar.
  const bant = $("bant");
  bant.textContent = "";
  for (let tekrar = 0; tekrar < 2; tekrar++) {
    for (const m of mesajlar) {
      const span = document.createElement("span");
      span.textContent = m;
      const ayrac = document.createElement("span");
      ayrac.className = "ayrac";
      ayrac.textContent = "{ }";
      bant.append(span, ayrac);
    }
  }
  // Uzunluktan bağımsız sabit okuma hızı
  requestAnimationFrame(() => {
    const yarim = bant.scrollWidth / 2;
    const hiz = window.innerWidth / 9;    // px/sn: ekran genişliğini ~9 sn'de geçer
    bant.style.animationDuration = `${Math.max(20, yarim / hiz)}s`;
  });
}

// index.html ile aynı ana karakter (jetpack'li lastik ördek)
// ---------------------------------------------------------------------
function yuvarlakDikdortgen(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// Jet alevi. yon: yerel açı (0 = düz aşağı, pozitif = geriye doğru), guc 0-1
function alevCiz(c, x, y, r, guc, zaman, yon) {
  const boy = r * (0.5 + 0.9 * guc) * (0.85 + 0.15 * Math.sin(zaman * 70));
  c.save();
  c.translate(x, y);
  c.rotate(yon);
  c.globalAlpha = Math.min(1, 0.35 + guc);
  c.fillStyle = "#ff7a1a";
  c.beginPath(); c.moveTo(-r * 0.17, 0); c.quadraticCurveTo(0, boy * 1.35, r * 0.17, 0); c.closePath(); c.fill();
  c.fillStyle = "#ffe066";
  c.beginPath(); c.moveTo(-r * 0.09, 0); c.quadraticCurveTo(0, boy * 0.8, r * 0.09, 0); c.closePath(); c.fill();
  c.restore();
}

function gozCiz(c, gx, gy, gr, d, gozbebekRenk) {
  if (d.olu) {
    c.strokeStyle = "#1b1b1b";
    c.lineWidth = gr * 0.45;
    const k = gr * 0.75;
    c.beginPath(); c.moveTo(gx - k, gy - k); c.lineTo(gx + k, gy + k); c.moveTo(gx + k, gy - k); c.lineTo(gx - k, gy + k); c.stroke();
  } else if (d.kirp) {
    c.strokeStyle = "#1b1b1b";
    c.lineWidth = gr * 0.35;
    c.beginPath(); c.arc(gx, gy - gr * 0.2, gr * 0.85, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
  } else {
    c.fillStyle = "#fff";
    c.beginPath(); c.arc(gx, gy, gr, 0, Math.PI * 2); c.fill();
    c.fillStyle = gozbebekRenk;
    c.beginPath(); c.arc(gx + gr * 0.3, gy + gr * 0.05, gr * 0.52, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#fff";
    c.beginPath(); c.arc(gx + gr * 0.45, gy - gr * 0.2, gr * 0.18, 0, Math.PI * 2); c.fill();
  }
}

// Jetpack'li sarı lastik ördek (rubber duck debugging), kafasında pilot gözlüğü
function ordekCiz(c, x, y, r, aci, d) {
  c.save();
  c.translate(x, y);
  c.rotate(aci);
  c.scale(d.sx || 1, d.sy || 1);
  c.lineCap = "round";
  c.lineJoin = "round";

  // Alev (jetpack nozulundan aşağı-geriye)
  if (d.alev > 0.02) alevCiz(c, -r * 1.02, r * 0.66, r, d.alev, d.zaman, 0.35);

  // Jetpack (gövdenin arkasında)
  c.fillStyle = "#8a9bb8";
  c.strokeStyle = "#3d4f6e";
  c.lineWidth = r * 0.08;
  yuvarlakDikdortgen(c, -r * 1.32, -r * 0.42, r * 0.6, r * 0.95, r * 0.18);
  c.fill(); c.stroke();
  c.fillStyle = "#1a73e8";
  c.fillRect(-r * 1.27, -r * 0.12, r * 0.5, r * 0.15);
  c.fillStyle = "#3d4f6e";
  c.beginPath(); c.moveTo(-r * 1.2, r * 0.5); c.lineTo(-r * 0.84, r * 0.5); c.lineTo(-r * 0.9, r * 0.68); c.lineTo(-r * 1.14, r * 0.68); c.closePath(); c.fill();

  // Gövde ve kuyruk
  c.fillStyle = "#ffd43b";
  c.strokeStyle = "#d99a00";
  c.lineWidth = r * 0.08;
  c.beginPath();
  c.moveTo(-r * 0.7, -r * 0.2);
  c.quadraticCurveTo(-r * 1.05, -r * 0.55, -r * 0.98, -r * 0.82);   // yukarı kalkık kuyruk
  c.quadraticCurveTo(-r * 0.55, -r * 0.62, -r * 0.2, -r * 0.42);
  c.lineTo(r * 0.3, -r * 0.3);
  c.quadraticCurveTo(r * 1.15, -r * 0.2, r * 1.0, r * 0.3);
  c.quadraticCurveTo(r * 0.8, r * 0.85, 0, r * 0.82);
  c.quadraticCurveTo(-r * 0.95, r * 0.8, -r * 1.0, r * 0.15);
  c.quadraticCurveTo(-r * 0.98, -r * 0.05, -r * 0.7, -r * 0.2);
  c.closePath();
  c.fill(); c.stroke();

  // Jetpack kayışı
  c.strokeStyle = "#3d4f6e";
  c.lineWidth = r * 0.12;
  c.beginPath(); c.moveTo(-r * 0.75, -r * 0.3); c.quadraticCurveTo(-r * 0.1, r * 0.05, r * 0.2, r * 0.78); c.stroke();

  // Kanat
  const kanat = Math.sin(d.kanat || 0) * 0.25;
  c.fillStyle = "#ffc21a";
  c.strokeStyle = "#d99a00";
  c.lineWidth = r * 0.07;
  c.save();
  c.translate(-r * 0.15, r * 0.18);
  c.rotate(-0.25 + kanat);
  c.beginPath(); c.ellipse(0, 0, r * 0.48, r * 0.27, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  c.restore();

  // Kafa
  const kx = r * 0.6, ky = -r * 0.68, kr = r * 0.52;
  c.fillStyle = "#ffd43b";
  c.strokeStyle = "#d99a00";
  c.lineWidth = r * 0.08;
  c.beginPath(); c.arc(kx, ky, kr, 0, Math.PI * 2); c.fill(); c.stroke();

  // Gaga
  c.fillStyle = "#ff8c1a";
  c.strokeStyle = "#d9660b";
  c.lineWidth = r * 0.06;
  c.beginPath();
  c.moveTo(r * 1.0, -r * 0.78);
  c.quadraticCurveTo(r * 1.55, -r * 0.74, r * 1.48, -r * 0.56);
  c.quadraticCurveTo(r * 1.3, -r * 0.42, r * 1.0, -r * 0.48);
  c.closePath(); c.fill(); c.stroke();

  // Yanak ve göz
  c.fillStyle = "rgba(255, 120, 120, 0.45)";
  c.beginPath(); c.ellipse(r * 0.82, -r * 0.45, r * 0.12, r * 0.08, 0, 0, Math.PI * 2); c.fill();
  gozCiz(c, r * 0.8, -r * 0.74, r * 0.17, d, "#1b1b1b");

  // Pilot gözlüğü (alnına itilmiş): kayış + iki cam
  c.strokeStyle = "#6b4226";
  c.lineWidth = r * 0.11;
  c.beginPath(); c.arc(kx, ky, kr * 0.98, Math.PI * 1.08, Math.PI * 1.62); c.stroke();
  for (const [gx, gy] of [[r * 0.4, -r * 1.12], [r * 0.78, -r * 1.12]]) {
    c.fillStyle = "#8d6e63";
    c.beginPath(); c.arc(gx, gy, r * 0.17, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#7dd3fc";
    c.beginPath(); c.arc(gx, gy, r * 0.11, 0, Math.PI * 2); c.fill();
    c.fillStyle = "rgba(255, 255, 255, 0.8)";
    c.beginPath(); c.arc(gx - r * 0.04, gy - r * 0.04, r * 0.035, 0, Math.PI * 2); c.fill();
  }
  c.strokeStyle = "#8d6e63";
  c.lineWidth = r * 0.06;
  c.beginPath(); c.moveTo(r * 0.57, -r * 1.12); c.lineTo(r * 0.61, -r * 1.12); c.stroke();

  c.restore();
}

// ---------------------------------------------------------------------
// MSKÜ ACM logosu (logo.svg): sayfa açılırken bir kez yüklenir, kenarlardaki
// şeffaf boşluk kırpılıp bir kaynak tuvale çizilir. Sonraki tüm çizimler bu
// tuvalden yapılır; SVG bir daha çizilmez. Dosya yoksa sessizce atlanır.
// ---------------------------------------------------------------------
const LOGO_DOSYASI = "logo.svg";
const LOGO_KAYNAK_G = 1200;   // kırpılmış kaynak tuvalin genişliği (px)
// Şeffaf kenarlar ölçülemezse (tarayıcı SVG çizilmiş tuvalden piksel okumaya
// izin vermezse) kullanılacak kırpma: Canva çıktısında logo, karenin ortasındaki yatay bant.
const LOGO_VARSAYILAN_KIRP = { x: 0, y: 0.29, w: 1, h: 0.42 };

function logoYukle() {
  return new Promise((tamam) => {
    const img = new Image();
    img.onload = () => {
      try { tamam(logoKaynakHazirla(img)); } catch (e) { tamam(null); }
    };
    img.onerror = () => tamam(null);
    img.src = LOGO_DOSYASI;
  });
}

function logoKirpmaBul(img) {
  try {
    const n = 256;
    const c = document.createElement("canvas");
    c.width = n; c.height = n;
    const x = c.getContext("2d");
    x.drawImage(img, 0, 0, n, n);
    const d = x.getImageData(0, 0, n, n).data;
    let x0 = n, y0 = n, x1 = -1, y1 = -1;
    for (let y = 0; y < n; y++) {
      for (let i = 0; i < n; i++) {
        if (d[(y * n + i) * 4 + 3] > 8) {
          if (i < x0) x0 = i;
          if (i > x1) x1 = i;
          if (y < y0) y0 = y;
          if (y > y1) y1 = y;
        }
      }
    }
    if (x1 < 0) return LOGO_VARSAYILAN_KIRP;
    x0 = Math.max(0, x0 - 2); y0 = Math.max(0, y0 - 2);
    x1 = Math.min(n - 1, x1 + 2); y1 = Math.min(n - 1, y1 + 2);
    return { x: x0 / n, y: y0 / n, w: (x1 - x0 + 1) / n, h: (y1 - y0 + 1) / n };
  } catch (e) {
    return LOGO_VARSAYILAN_KIRP;
  }
}

function logoKaynakHazirla(img) {
  const iw = img.naturalWidth || 2000, ih = img.naturalHeight || 2000;
  const k = logoKirpmaBul(img);
  const c = document.createElement("canvas");
  c.width = LOGO_KAYNAK_G;
  c.height = Math.max(1, Math.round(LOGO_KAYNAK_G * (k.h * ih) / (k.w * iw)));
  c.getContext("2d").drawImage(img, k.x * iw, k.y * ih, k.w * iw, k.h * ih, 0, 0, c.width, c.height);
  return c;
}

// Ekranlardaki logolar (.logo-renkli tuvalleri): kaynak orijinal renklerle çizilir,
// CSS filtresi (brightness(0) invert(1)) tek renk beyaza çevirir; beyaz kutu yok.
// Zeplindeki kopya bundan bağımsızdır, orijinal renkleriyle kalır.
// Logo yüklenemezse .logo-zemin "gizli" kalır ve yer kaplamaz.
function renkliLogolariCiz(kaynak) {
  for (const c of document.querySelectorAll(".logo-renkli")) {
    c.width = kaynak.width / 2;
    c.height = Math.round(kaynak.height / 2);
    c.getContext("2d").drawImage(kaynak, 0, 0, c.width, c.height);
    c.parentElement.classList.remove("gizli");
  }
}

function logoCiz() {
  const c = $("logo");
  const x = c.getContext("2d");
  x.clearRect(0, 0, c.width, c.height);
  ordekCiz(x, c.width * 0.5, c.height * 0.6, c.width * 0.26, -0.1, { zaman: 0, kanat: 1.2, kirp: false, olu: false, alev: 0.3, sx: 1, sy: 1 });
}

// Başlat
// ---------------------------------------------------------------------
if (ODUL_METNI) {
  $("odul").textContent = `Ödül: ${ODUL_METNI}`;
  $("odul").classList.remove("gizli");
}
logoCiz();
bantKur();
qrCiz();
let boyutZamanlayici = 0;
window.addEventListener("resize", () => {
  clearTimeout(boyutZamanlayici);
  boyutZamanlayici = setTimeout(() => { qrCiz(); bantKur(); }, 200);
});
yenile();
logoYukle().then((kaynak) => { if (kaynak) renkliLogolariCiz(kaynak); });
